<!doctype html>
<!-- Adapted from itldg/web-serial-debug (c0fc58b9), Apache-2.0. See NOTICE.md. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="轻风雨斜 OS 串口调试：在浏览器中连接串口设备，接收日志并发送文本或 HEX 数据。" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>串口调试 · 轻风雨斜 OS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/serial/styles.css?v=20260929-1" />
    <script src="/serial/vendor/ansi_up.min.js?v=5.1.0" defer></script>
    <script type="module" src="/serial/script.js?v=20260929-1"></script>
  </head>
  <body class="serial-page" data-state="disconnected">
    <main class="workspace">
      <aside class="settings-panel glass-panel" aria-labelledby="settings-heading">
        <header class="page-header">
          <a class="back-link" id="serial-back" href="/" title="返回我的 OS"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13" /></svg><span>返回我的 OS</span></a>
          <div class="page-heading">
            <h1>串口调试</h1>
            <span class="connection-state" id="connection-state" role="status"><i aria-hidden="true"></i><span>未连接</span></span>
          </div>
        </header>
        <div class="panel-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5m8-5v5M6 8h12v5a6 6 0 0 1-12 0V8Zm6 11v3" /></svg><h2 id="settings-heading">串口设置</h2></div>
        <form id="serial-options-form">
          <fieldset id="connection-fields">
            <legend class="sr-only">设备与连接参数</legend>
            <label class="field"><span>已授权设备</span><select id="serial-port-list"><option value="">暂无已授权设备</option></select></label>
            <button class="select-port secondary-button" id="serial-select-port" type="button"><span aria-hidden="true">＋</span> 选择串口设备</button>
            <div class="field-divider"></div>
            <label class="field"><span>波特率 <small>baud</small></span><input id="serial-baud" type="number" min="1" max="4294967295" step="1" value="115200" list="baud-list" required /></label>
            <datalist id="baud-list"><option value="110"></option><option value="300"></option><option value="600"></option><option value="1200"></option><option value="2400"></option><option value="4800"></option><option value="7200"></option><option value="9600"></option><option value="14400"></option><option value="19200"></option><option value="28800"></option><option value="38400"></option><option value="56000"></option><option value="57600"></option><option value="76800"></option><option value="115200"></option><option value="230400"></option><option value="460800"></option><option value="921600"></option></datalist>
            <div class="field-pair">
              <label class="field"><span>数据位</span><select id="serial-data-bits"><option value="8">8</option><option value="7">7</option></select></label>
              <label class="field"><span>停止位</span><select id="serial-stop-bits"><option value="1">1</option><option value="2">2</option></select></label>
            </div>
            <label class="field"><span>校验位</span><select id="serial-parity"><option value="none">无校验 · None</option><option value="even">偶校验 · Even</option><option value="odd">奇校验 · Odd</option></select></label>
            <label class="field"><span>缓冲区 <small>字节</small></span><input id="serial-buffer-size" type="number" min="1" max="16777215" step="1" value="1024" list="buffer-list" required /></label>
            <datalist id="buffer-list"><option value="255"></option><option value="512"></option><option value="1024"></option><option value="2048"></option><option value="4096"></option><option value="8192"></option></datalist>
            <label class="field"><span>流控制</span><select id="serial-flow-control"><option value="none">无 · None</option><option value="hardware">硬件 · RTS / CTS</option></select></label>
          </fieldset>
          <button class="primary-button connect-button" id="serial-open-or-close" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.4 5.6a9 9 0 1 0 11.2 0" /></svg><span>打开串口</span></button>
          <p id="serial-status" class="device-status" aria-live="polite">尚未选择串口设备</p>
        </form>
        <div class="settings-note"><span class="note-dot" aria-hidden="true"></span><p>参数自动保存，串口数据仅在本机处理。</p></div>
        <footer class="page-footer"><a href="https://github.com/itldg/web-serial-debug" target="_blank" rel="noopener noreferrer">基于 Web Serial Debug ↗</a></footer>
      </aside>

      <section class="terminal-panel glass-panel" aria-labelledby="logs-heading">
        <header class="log-heading">
          <div class="panel-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 6 6-6 6m9 0h7" /></svg><h2 id="logs-heading">收发日志</h2></div>
          <div class="log-actions"><button id="serial-copy" class="quiet-button" type="button" disabled>复制</button><button id="serial-save" class="quiet-button" type="button" disabled>下载日志</button><span aria-hidden="true"></span><button id="serial-clear" class="quiet-button" type="button" disabled>清空</button></div>
        </header>
        <div class="log-toolbar">
          <label class="inline-field"><span>显示</span><select id="serial-log-type"><option value="hex&text">HEX + TEXT</option><option value="hex">HEX</option><option value="text">TEXT</option><option value="ansi">彩色 ANSI</option></select></label>
          <label class="inline-field"><span>分包超时</span><span class="input-with-unit"><input id="serial-timer-out" type="number" min="0" max="60000" step="1" value="50" title="接收数据的间隔达到此值后合并显示；0 表示立即显示" aria-label="分包超时（毫秒）" required /><span>ms</span></span></label>
          <div class="display-checks"><label class="check"><input id="serial-show-time" type="checkbox" checked /><span>时间戳</span></label><label class="check"><input id="serial-auto-scroll" type="checkbox" checked /><span>自动滚动</span></label></div>
        </div>
        <div class="message" id="serial-message" role="status" aria-live="polite" hidden></div>
        <div class="log-viewport" id="log-viewport" tabindex="0" aria-label="串口收发日志">
          <div class="empty-logs" id="empty-logs"><span class="empty-terminal" aria-hidden="true">&gt;_</span><h3>等待串口数据</h3><p>选择设备并打开串口后，<br />收发数据会显示在这里。</p><span class="empty-detail">TEXT / HEX / ANSI</span></div>
          <div id="serial-logs" role="log" aria-live="off" aria-label="数据记录"></div>
        </div>
        <div class="log-footer"><span><i class="rx-dot" aria-hidden="true"></i>接收 <b id="received-count">0</b> B <i class="tx-dot" aria-hidden="true"></i>发送 <b id="sent-count">0</b> B</span><span id="log-count">0 条记录</span></div>

        <form class="send-panel" id="serial-send-form">
          <label class="send-label" for="serial-send-content">发送数据 <span id="send-format">UTF-8 TEXT</span></label>
          <textarea id="serial-send-content" rows="3" maxlength="262144" spellcheck="false" placeholder="输入文本，或开启 HEX 后输入十六进制数据，例如 48 65 6C 6C 6F"></textarea>
          <div class="send-controls">
            <div class="send-options"><label class="check"><input type="checkbox" id="serial-hex-send" /><span>HEX 发送</span></label><label class="check"><input type="checkbox" id="serial-add-crlf" /><span>追加 CRLF</span></label><label class="check"><input type="checkbox" id="serial-loop-send" disabled /><span>循环发送</span></label><label class="input-with-unit"><input id="serial-loop-send-time" type="number" min="1" max="3600000" step="1" value="1000" aria-label="循环发送间隔（毫秒）" required /><span>ms</span></label></div>
            <button id="serial-send" type="submit" class="primary-button" disabled>发送<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14" /></svg></button>
          </div>
        </form>
      </section>
    </main>
    <noscript><p class="noscript-message">请启用 JavaScript 后使用串口调试功能。</p></noscript>
  </body>
</html>
