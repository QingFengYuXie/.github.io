<!doctype html>
<!-- Adapted from itldg/web-serial-debug (c0fc58b9), Apache-2.0. See NOTICE.md. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="轻风雨斜 OS 串口调试：在浏览器中连接串口设备，接收日志并发送文本或 HEX 数据。" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>串口调试 · 轻风雨斜 OS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/serial/styles.css?v=20260929-4" />
    <script src="/serial/vendor/ansi_up.min.js?v=5.1.0" defer></script>
    <script type="module" src="/serial/script.js?v=20260929-3"></script>
  </head>
  <body class="serial-page" data-state="disconnected">
    <main class="workspace">
      <aside class="settings-panel glass-panel" aria-label="串口设置与系统提示">
        <header class="page-header">
          <div class="page-heading">
            <a class="back-link" id="serial-back" href="/" title="返回我的 OS" aria-label="返回我的 OS"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13" /></svg></a>
            <h1>串口调试</h1>
            <span class="connection-state" id="connection-state" role="status"><i aria-hidden="true"></i><span>未连接</span></span>
          </div>
        </header>
        <div class="connection-actions" role="group" aria-label="串口连接操作">
          <button class="select-port secondary-button" id="serial-select-port" type="button">选择串口</button>
          <button class="primary-button connect-button" id="serial-open-or-close" type="button" disabled><span>打开串口</span></button>
        </div>
        <div class="message" id="serial-message" role="status" aria-live="polite" hidden></div>
        <form id="serial-options-form">
          <fieldset id="connection-fields">
            <legend class="sr-only">设备与连接参数</legend>
            <label class="field"><span>设备</span><select id="serial-port-list" aria-label="已授权串口设备"><option value="">暂无已授权设备</option></select></label>
            <label class="field"><span id="baud-label">波特率</span><span class="baud-picker">
              <input id="serial-baud" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="10" value="115200" autocomplete="off" spellcheck="false" role="combobox" aria-labelledby="baud-label" aria-controls="baud-options" aria-expanded="false" aria-autocomplete="none" required />
              <button id="serial-baud-toggle" class="baud-toggle" type="button" tabindex="-1" title="常用波特率" aria-label="常用波特率" aria-haspopup="listbox" aria-controls="baud-options" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg></button>
              <span id="baud-options" class="baud-options" role="listbox" aria-labelledby="baud-label" hidden>
                <span id="baud-option-9600" role="option" data-value="9600" aria-selected="false">9600</span>
                <span id="baud-option-19200" role="option" data-value="19200" aria-selected="false">19200</span>
                <span id="baud-option-38400" role="option" data-value="38400" aria-selected="false">38400</span>
                <span id="baud-option-57600" role="option" data-value="57600" aria-selected="false">57600</span>
                <span id="baud-option-115200" role="option" data-value="115200" aria-selected="true">115200</span>
                <span id="baud-option-230400" role="option" data-value="230400" aria-selected="false">230400</span>
                <span id="baud-option-460800" role="option" data-value="460800" aria-selected="false">460800</span>
                <span id="baud-option-921600" role="option" data-value="921600" aria-selected="false">921600</span>
              </span>
            </span></label>
            <label class="field"><span>数据位</span><select id="serial-data-bits"><option value="8">8</option><option value="7">7</option></select></label>
            <label class="field"><span>停止位</span><select id="serial-stop-bits"><option value="1">1</option><option value="2">2</option></select></label>
            <label class="field"><span>校验位</span><select id="serial-parity"><option value="none">None</option><option value="even">Even</option><option value="odd">Odd</option></select></label>
            <label class="field buffer-field"><span>缓冲区</span><span class="buffer-input"><input id="serial-buffer-size" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="8" value="1024" required /><span class="field-unit">字节</span></span></label>
            <label class="field"><span>流控制</span><select id="serial-flow-control"><option value="none">None</option><option value="hardware">RTS / CTS</option></select></label>
          </fieldset>
          <p id="serial-status" class="device-status" aria-live="polite">尚未选择串口设备</p>
        </form>
        <div class="settings-note"><span class="note-dot" aria-hidden="true"></span><p>参数自动保存，串口数据仅在本机处理。</p></div>
        <footer class="page-footer"><a href="https://github.com/itldg/web-serial-debug" target="_blank" rel="noopener noreferrer">基于 Web Serial Debug ↗</a></footer>
      </aside>

      <section class="terminal-panel glass-panel" aria-labelledby="logs-heading">
        <h2 id="logs-heading" class="sr-only">收发日志</h2>
        <header class="log-toolbar" aria-label="日志显示与操作">
          <label class="inline-field"><span class="field-caption">显示</span><select id="serial-log-type" aria-label="日志显示格式" title="日志显示格式"><option value="hex&text">HEX + TEXT</option><option value="hex">HEX</option><option value="text">TEXT</option><option value="ansi">彩色 ANSI</option></select></label>
          <label class="inline-field"><span class="field-caption">分包超时</span><span class="input-with-unit"><input id="serial-timer-out" type="number" min="0" max="60000" step="1" value="50" title="分包超时：接收间隔达到此值后合并显示；0 表示立即显示" aria-label="分包超时（毫秒）" required /><span>ms</span></span></label>
          <label class="inline-field"><span class="field-caption">编码</span><select id="serial-encoding" aria-label="收发文本编码" title="收发文本编码"><option value="utf-8">UTF-8</option><option value="gb2312">GB2312</option></select></label>
          <div class="display-checks"><label class="check"><input id="serial-show-time" type="checkbox" checked /><span>时间戳</span></label><label class="check"><input id="serial-auto-scroll" type="checkbox" checked /><span>自动滚动</span></label></div>
          <div class="log-actions"><button id="serial-copy" class="quiet-button" type="button" disabled>复制</button><button id="serial-save" class="quiet-button" type="button" disabled>下载日志</button><span aria-hidden="true"></span><button id="serial-clear" class="quiet-button" type="button" disabled>清空</button></div>
        </header>
        <div class="log-viewport" id="log-viewport" tabindex="0" aria-label="串口收发日志">
          <div class="empty-logs" id="empty-logs"><span class="empty-terminal" aria-hidden="true">&gt;_</span><h3>等待串口数据</h3><p>选择设备并打开串口后，<br />收发数据会显示在这里。</p><span class="empty-detail">TEXT / HEX / ANSI</span></div>
          <div id="serial-logs" role="log" aria-live="off" aria-label="数据记录"></div>
        </div>
        <div class="log-footer"><span><i class="rx-dot" aria-hidden="true"></i>接收 <b id="received-count">0</b> B <i class="tx-dot" aria-hidden="true"></i>发送 <b id="sent-count">0</b> B</span><span id="log-count">0 条记录</span></div>

        <form class="send-panel" id="serial-send-form">
          <textarea id="serial-send-content" aria-label="发送数据" rows="3" maxlength="262144" spellcheck="false" placeholder="输入文本，或开启 HEX 后输入十六进制数据，例如 48 65 6C 6C 6F"></textarea>
          <div class="send-controls">
            <div class="send-options"><label class="check"><input type="checkbox" id="serial-hex-send" /><span>HEX 发送</span></label><label class="check"><input type="checkbox" id="serial-add-crlf" /><span>追加 CRLF</span></label><label class="check"><input type="checkbox" id="serial-loop-send" disabled /><span>循环发送</span></label><label class="input-with-unit"><input id="serial-loop-send-time" type="number" min="1" max="3600000" step="1" value="1000" aria-label="循环发送间隔（毫秒）" required /><span>ms</span></label></div>
            <button id="serial-send" type="submit" class="primary-button" disabled>发送<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14" /></svg></button>
          </div>
        </form>
      </section>
    </main>
    <noscript><p class="noscript-message">请启用 JavaScript 后使用串口调试功能。</p></noscript>
  </body>
</html>
