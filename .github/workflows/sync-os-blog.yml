name: Sync OS Blog

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, pinned, unpinned]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-os-blog
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name != 'issue_comment' || !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate blog data and RSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_blog.py
      - name: Publish generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog-data.json feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "Sync OS blog from Issues"
          git push origin main
