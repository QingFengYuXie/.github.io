name: build Gmeek

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "static/**"
      - ".github/workflows/Gmeek.yml"
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 16 * * *"
    
jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' }}
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Get config.json
        run: |
          echo "====== check config.josn file ======"
          cat config.json
          echo "====== check config.josn end  ======"
          sudo apt-get install jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Clone source code
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)
          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek;
          cd /opt/Gmeek/
          lastTag=$(git describe --tags `git rev-list --tags --max-count=1`)
          if [ $GMEEK_VERSION == 'last' ]; then git checkout $lastTag; else git checkout $GMEEK_VERSION; fi;

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt

      - name: Generate new html
        run: |
          cp -r ./* /opt/Gmeek/
          cd /opt/Gmeek/
          mkdir -p backup
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          rm -rf /tmp/Gmeek-dynamic /opt/Gmeek/docs/dynamic
          mkdir -p /tmp/Gmeek-dynamic /opt/Gmeek/docs/dynamic
          cp -a /opt/Gmeek/docs/. /tmp/Gmeek-dynamic/
          cp -a /tmp/Gmeek-dynamic/. /opt/Gmeek/docs/dynamic/
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          docs_dir = Path('/opt/Gmeek/docs')
          dynamic_dir = docs_dir / 'dynamic'
          primer_path = docs_dir / 'primer.css'
          shutil.copy2('/opt/Gmeek/static/primer.css', primer_path)

          for page in docs_dir.rglob('*.html'):
              content = page.read_text(encoding='utf-8')
              content = content.replace(
                  "href='https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/Primer/21.0.7/primer.css'",
                  "href='/primer.css'",
              ).replace(
                  'href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/Primer/21.0.7/primer.css"',
                  'href="/primer.css"',
              )
              is_dynamic_page = dynamic_dir in page.parents
              if is_dynamic_page:
                  content = content.replace(
                      'href="https://qfyx.top/index.html"',
                      'href="https://qfyx.top/dynamic/"',
                  )
                  content = re.sub(
                      r'href="https://qfyx.top/page(\d+)\.html"',
                      r'href="https://qfyx.top/dynamic/page\1.html"',
                      content,
                  )
              # Keep the temporary test posts readable until their GitHub
              # Issues can be renamed with a valid GitHub token.
              content = re.sub(
                  r'\?{6}(\s+\d{2})',
                  lambda match: '\u6d4b\u8bd5\u52a8\u6001' + match.group(1),
                  content,
              )
              def test_post_text(number):
                  return (
                      f'\u8fd9\u662f\u7b2c {number} \u7bc7\u6d4b\u8bd5\u52a8\u6001\uff0c'
                      '\u7528\u4e8e\u9a8c\u8bc1\u6587\u7ae0\u8be6\u60c5\u3001\u5206\u9875\u548c\u8bc4\u8bba\u529f\u80fd\u3002'
                  )

              content = re.sub(
                  r'(<meta name="description" content=")\?{3}\s+(\d+)[^"]*(">)',
                  lambda match: match.group(1) + test_post_text(match.group(2)) + match.group(3),
                  content,
              )
              content = re.sub(
                  r'(<meta property="og:description" content=")\?{3}\s+(\d+)[^"]*(">)',
                  lambda match: match.group(1) + test_post_text(match.group(2)) + match.group(3),
                  content,
              )
              content = re.sub(
                  r'(<div class="markdown-body" id="postBody">)\s*<p>\?{3}\s+(\d+).*?</p>\s*<p>\?{5,}.*?</p>(</div>)',
                  lambda match: (
                      match.group(1)
                      + f'<p>{test_post_text(match.group(2))}</p>'
                      + '<p>\u6d4b\u8bd5\u5185\u5bb9\u7531\u81ea\u52a8\u5316\u751f\u6210\uff0c\u9875\u9762\u663e\u793a\u6b63\u5e38\u5373\u53ef\u3002</p>'
                      + match.group(3)
                  ),
                  content,
              )
              content = content.replace('href="tag.html#????"', 'href="tag.html#\u6d4b\u8bd5"')
              content = content.replace('>????</a>', '>\u6d4b\u8bd5</a>')
              issue_match = re.search(
                  r'https://github\.com/[^/]+/[^/]+/issues/(\d+)',
                  content,
              )
              if issue_match:
                  content = content.replace(
                      'script.setAttribute("issue-term","title");',
                      f'script.setAttribute("issue-number","{issue_match.group(1)}");',
                  )
              page.write_text(content, encoding='utf-8')

          # The temporary test Issues were created with literal question marks
          # in their titles and label. Gmeek's search page reads postList.json
          # directly, so repair both the root and /dynamic search indexes too.
          for index_path in docs_dir.rglob('postList.json'):
              data = json.loads(index_path.read_text(encoding='utf-8'))
              for key, post in data.items():
                  if not (key.startswith('P') and isinstance(post, dict)):
                      continue
                  post['postTitle'] = re.sub(
                      r'^\?{6}\s+(\d{2})$',
                      lambda match: '\u6d4b\u8bd5\u52a8\u6001 ' + match.group(1),
                      post.get('postTitle', ''),
                  )
                  post['labels'] = [
                      '\u6d4b\u8bd5' if label == '????' else label
                      for label in post.get('labels', [])
                  ]

              label_colors = data.get('labelColorDict', {})
              broken_label_color = label_colors.pop('????', None)
              if broken_label_color and '\u6d4b\u8bd5' not in label_colors:
                  label_colors['\u6d4b\u8bd5'] = broken_label_color

              index_path.write_text(
                  json.dumps(data, ensure_ascii=False),
                  encoding='utf-8',
              )
          PY
          cp /opt/Gmeek/static/root-redirect.html /opt/Gmeek/docs/index.html
          cp -a /opt/Gmeek/docs ${{ github.workspace }} 
          cp -a /opt/Gmeek/backup ${{ github.workspace }} 
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }} 
          
      - name: update html
        run: |
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"
          sleep 3
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.'
          
  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
