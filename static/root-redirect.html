<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=/os/">
    <title>正在进入我的OS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #050706; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #dce4df;
        font: 12px/1.5 "Cascadia Mono", Consolas, monospace;
        text-shadow: 0 0 8px rgba(220, 228, 223, .12);
      }
      .redirect-splash {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .redirect-splash p {
        margin: 0;
        color: rgba(220, 228, 223, .82);
        letter-spacing: .08em;
      }
      noscript { position: absolute; }
      noscript a { color: inherit; }
    </style>
    <script>window.location.replace('/os/');</script>
  </head>
  <body>
    <main class="redirect-splash" aria-live="polite">
      <p>正在进入我的OS</p>
    </main>
    <noscript><a href="/os/">进入我的OS</a></noscript>
  </body>
</html>
